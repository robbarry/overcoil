name: Overcoil
options:
  bundleIdPrefix: com.robbarry
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3XLD352MG9
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.1.0
targets:
  Overcoil:
    type: application
    platform: iOS
    sources: [Overcoil]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robbarry.overcoil
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        OVERCOIL_SOURCE_REVISION: local-xcode-build
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Overcoil
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Photograph your watch to save a timing reading or reference photo."
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  OvercoilUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OvercoilUITests]
    dependencies:
      - target: Overcoil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robbarry.overcoil.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Overcoil
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Overcoil:
    build:
      targets:
        Overcoil: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets: [OvercoilUITests]
